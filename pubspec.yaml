name: islamic_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  dio: ^5.10.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  fpdart: ^1.2.0
  google_fonts: ^8.2.0
  screen_go: ^1.1.8
  permission_handler: ^12.0.3
  intl: ^0.20.3
  # Media & Utilities
  video_player: ^2.14.0
  path_provider: ^2.1.6
  internet_connection_checker: ^3.0.1
  flutter_compass: ^0.8.1

  # Audio
  just_audio: ^0.9.38
  just_audio_background: ^0.0.1-beta.17

  # Notifications
  flutter_local_notifications: ^17.1.2
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  firebase_auth: ^5.7.0

  # Location & Times
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  equatable: ^2.1.0
  hijri: ^3.0.0
  android_alarm_manager_plus: ^4.0.4

  # Caching
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_hive_store: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - lib/core/images/
    - lib/core/assets/stories.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "lib/core/images/logo.png"
  remove_alpha_ios: true
